version: '3.8'

services:
  # The central hub for WebSocket connections
  websocket-hub:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./websocket_hub:/app
    command: >
      bash -c "pip install -r requirements.txt && python websocket_hub.py"
    ports:
      - "8765:8765"

  # The MetaTrader5 container
  mt5:
    build: .
    depends_on:
      - websocket-hub
    env_file: .env
    environment:
      - WEBSOCKET_URI=ws://websocket-hub:8765
    ports:
      - "8080:8080"
